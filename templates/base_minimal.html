{% load static %}
<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}LearnHub{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#acbfff",
              "surface-container-lowest": "#ffffff",
              "primary-fixed": "#dbe1ff",
              "error-container": "#ffdad6",
              "tertiary-container": "#bc4800",
              "on-tertiary-fixed-variant": "#7d2d00",
              "inverse-surface": "#2e3039",
              "on-primary-container": "#eeefff",
              "outline": "#737686",
              "primary-container": "#2563eb",
              "tertiary": "#943700",
              "on-primary-fixed-variant": "#003ea8",
              "secondary": "#495c95",
              "on-error-container": "#93000a",
              "on-surface": "#191b23",
              "tertiary-fixed-dim": "#ffb596",
              "on-secondary-fixed": "#00174b",
              "on-secondary-container": "#394c84",
              "surface-bright": "#faf8ff",
              "primary": "#004ac6",
              "secondary-fixed-dim": "#b4c5ff",
              "surface-container-high": "#e7e7f3",
              "secondary-fixed": "#dbe1ff",
              "surface-container-highest": "#e1e2ed",
              "surface-container-low": "#f3f3fe",
              "error": "#ba1a1a",
              "on-tertiary-container": "#ffede6",
              "surface-variant": "#e1e2ed",
              "inverse-primary": "#b4c5ff",
              "background": "#faf8ff",
              "on-primary-fixed": "#00174b",
              "surface": "#faf8ff",
              "outline-variant": "#c3c6d7",
              "on-secondary": "#ffffff",
              "surface-dim": "#d9d9e5",
              "on-tertiary": "#ffffff",
              "on-background": "#191b23",
              "on-error": "#ffffff",
              "on-tertiary-fixed": "#360f00",
              "on-secondary-fixed-variant": "#31447b",
              "surface-container": "#ededf9",
              "tertiary-fixed": "#ffdbcd",
              "surface-tint": "#0053db",
              "primary-fixed-dim": "#b4c5ff",
              "on-primary": "#ffffff",
              "on-surface-variant": "#434655",
              "inverse-on-surface": "#f0f0fb"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        @layer base {
            input[type='text'],
            input[type='password'],
            input[type='email'],
            input[type='number'],
            input[type='url'],
            input[type='date'],
            input[type='datetime-local'],
            input[type='month'],
            input[type='search'],
            input[type='tel'],
            input[type='time'],
            input[type='week'],
            textarea,
            select {
                @apply w-full bg-surface-container-high border-0 border-b border-outline-variant/30 rounded-t px-4 py-3 text-on-surface focus:ring-0 focus:outline-none transition-colors focus:bg-surface-container-highest;
            }
        }
    </style>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .signature-texture {
            background: linear-gradient(135deg, #004ac6 0%, #2563eb 100%);
        }
        .glass-panel {
            background: rgba(250, 248, 255, 0.7);
            backdrop-filter: blur(24px);
        }
        .ghost-border {
            outline: 1px solid rgba(195, 198, 215, 0.15);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface selection:bg-secondary-container selection:text-on-secondary-container min-h-screen flex flex-col">
{% if messages %}
<div id="messages-container" class="max-w-md mx-auto w-full px-6 mt-4 z-50 absolute top-4 left-1/2 -translate-x-1/2">
    {% for message in messages %}
    <div class="message-alert p-4 mb-4 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-700{% elif message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %} shadow-lg flex justify-between items-center transition-opacity duration-500">
        <span>{{ message }}</span>
        <button onclick="this.parentElement.style.opacity='0'; setTimeout(() => this.parentElement.remove(), 500);" class="ml-4 opacity-50 hover:opacity-100 focus:outline-none">
            <span class="material-symbols-outlined text-sm">close</span>
        </button>
    </div>
    {% endfor %}
</div>
<script>
    setTimeout(() => {
        const messages = document.querySelectorAll('.message-alert');
        messages.forEach(msg => {
            msg.style.opacity = '0';
            setTimeout(() => msg.remove(), 500);
        });
    }, 5000);
</script>
{% endif %}
{% block content %}{% endblock %}
<footer class="w-full py-8 px-6 mt-auto">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
<p class="text-[0.75rem] text-on-surface-variant font-medium">© 2024 LearnHub. All rights reserved.</p>
<div class="flex gap-8">
<a class="text-[0.75rem] text-on-surface-variant hover:text-primary transition-colors font-medium" href="#">Terms of Service</a>
<a class="text-[0.75rem] text-on-surface-variant hover:text-primary transition-colors font-medium" href="#">Privacy Policy</a>
<a class="text-[0.75rem] text-on-surface-variant hover:text-primary transition-colors font-medium" href="#">Contact Support</a>
</div>
</div>
</footer>
</body>
</html>
